# ============================================================
# 博客主配置文件 —— 一般只需要改带「改这里」的几项
# ============================================================

# 部署到 GitHub Pages 时，构建流程会自动填入正确的地址，这里不用改
baseURL = "https://example.github.io/"

title = "虽然没人看但是我就随便写写的博客"            # 改这里：博客名称
theme = "PaperMod"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
hasCJKLanguage = true             # 让中文字数统计、阅读时间计算正确
enableRobotsTXT = true
enableEmoji = true

[pagination]
  pagerSize = 10                  # 首页每页显示几篇文章

[outputs]
  home = ["HTML", "RSS", "JSON"]  # JSON 用于站内搜索

[caches.images]
  dir = ":cacheDir/images"

# ------------------------------------------------------------
# 主题参数
# ------------------------------------------------------------
[params]
  env = "production"
  description = "主要领域覆盖深度学习，具身智能等"   # 改这里：一句话简介
  author = "alex"                      # 改这里
  defaultTheme = "auto"                    # 跟随系统深色/浅色模式
  DateFormat = "2006-01-02"

  # 首页显示哪些分区的文章（papers = 论文阅读，posts = 普通文章）
  mainSections = ["papers", "posts"]

  ShowReadingTime = true
  ShowWordCount = true
  ShowPostNavLinks = true          # 文章底部「上一篇/下一篇」
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true       # 代码块右上角的复制按钮
  ShowToc = true                   # 文章目录
  TocOpen = false
  ShowShareButtons = false
  ShowRssButtonInSectionTermList = true

  [params.homeInfoParams]
    Title = "my blog"
    Content = "你好，希望我的一些笔记能够对你有所帮助。"   # 改这里：首页欢迎语

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/luvlife4"   # 改这里

  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

  # 站内搜索设置
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

# ------------------------------------------------------------
# 顶部菜单
# ------------------------------------------------------------
[menu]
  [[menu.main]]
    identifier = "papers"
    name = "论文阅读"
    url = "/papers/"
    weight = 5
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 30
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 40

# ------------------------------------------------------------
# Markdown 与代码高亮
# ------------------------------------------------------------
[markup]
  [markup.goldmark.renderer]
    unsafe = true                  # 允许在 Markdown 里写 HTML
  [markup.highlight]
    noClasses = false              # 使用主题自带的代码高亮配色（自动适配深色模式）
    codeFences = true
    guessSyntax = true
